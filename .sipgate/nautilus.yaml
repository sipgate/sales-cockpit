apiVersion: nautilus.sipgate.cloud/v1beta1
kind: Service
metadata:
  name: sales-cockpit
spec:
  backup: "false"
  config:
  - egressNetworkPolicies:
    - port: 443
      target: api.hubspot.com
    - port: 443
      target: sipgatede.atlassian.net
    - port: 443
      target: bigquery.googleapis.com
    - port: 443
      target: oauth2.googleapis.com
    secrets:
    - name: HUBSPOT_PRIVATE_APP_TOKEN
      value: 
    - name: JIRA_API_TOKEN
      value: 
    - name: JIRA_BASE_URL
      value: 
    - name: JIRA_EMAIL
      value: 
    - name: MCP_SECRET
      value: 
    - name: GOOGLE_APPLICATION_CREDENTIALS_JSON
      value: 
    selector:
      env: dev
  containerized: "true"
  image: sipgate/service/nautilus/sales-cockpit
  livenessProbe:
    failureThreshold: 60
    httpGet:
      path: /health
      port: http
      scheme: HTTP
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  localPersistence: "false"
  onCallSchedule: bestEffort
  owner: productpeople
  pciDssRelevant: "false"
  platform: nautilus
  ports:
  - name: http
    port: 8080
    protocol: TCP
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /health
      port: http
      scheme: HTTP
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  replicasPerLocation: 1
  singleton: "false"
  tlsProvider: external
  virtualized: "true"
status:
  features: {}
  lastReconcileTime: null
